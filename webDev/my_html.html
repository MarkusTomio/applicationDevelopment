<!DOCTYPE html>
<html>
    <head>
        <!-- <meta charset="UTF-8"> -->
        <title>My HTML</title>
        <link rel="stylesheet" href="https://openlayers.org/en/v4.6.5/css/ol.css" type="text/css">
    </head>
    <body>
        <div id="map" class="map" tabindex="0"></div>
        <button id="zoom-in">Zoom In</button>
        <button id="zoom-out">Zoom Out</button>
        <button id="reset">Reset View</button>
        <button id="left">Pan Left</button>
        <button id="right">Pan Right</button>
        <button id="up">Pan Up</button>
        <button id="down">Pan Down</button>
        <button id="current-location">Zoom To Your Location</button>
        <button id="measure">Measure Geographic Distance</button>
        <span id="measureStatus"></span>
        <button id="reset-measure">Reset Measurement</button>
        <script src="https://cdn.polyfill.io/v2/polyfill.min.js?features=requestAnimationFrame,Element.prototype.classList,URL"></script>
        <script src="https://openlayers.org/en/v4.6.5/build/ol.js"></script>
        <script src="mainmap.js"></script>
    </body>
</html>
